[package]
name = "mcp-server"
version = "0.1.0"
edition = "2021"

[dependencies]
engine = { path = "../engine" }
infrastructure = { path = "../infrastructure" }
game-session = { path = "../game-session" }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "io-std"] }
anyhow = "1.0"
rmcp = { version = "1.6.0", features = ["server", "transport-io", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
schemars = "1.0"

[dev-dependencies]
tempfile = "3.27"
