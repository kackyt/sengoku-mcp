[package]
name = "api-server"
version = "0.1.0"
edition = "2021"

[dependencies]
engine = { path = "../engine" }
infrastructure = { path = "../infrastructure" }
game-session = { path = "../game-session" }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "net", "signal"] }
axum = "0.8"
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
utoipa = { version = "6", features = ["chrono", "axum_extras"] }
utoipa-scalar = { version = "0.4", features = ["axum"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3.27"
mcp-server = { path = "../mcp-server" }
object_store = "0.14"
rmcp = { version = "1.6.0", features = ["server"] }
